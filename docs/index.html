<style>

    padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));

  .stats { font-weight: 800; font-size: clamp(12px, 3.8vh, 18px); opacity: .95; text-shadow: 0 2px 4px rgba(0, 0, 0, .6); }

(() => {

      "................................==...PP.....PP...MMM.......................................MMM......................oo..........X...X..........XX...........ooo...........................XXXXXXX.........................",

/* ============================================================================

   ============================================================================ */
const TILE = 32, ROWS = 13, MAX_STEP = 1 / 120;

const SOLID = new Set(['#', 'B', '?', '*', 'U', 'X', 'P']);
const VALID_TILES = new Set(['.', '#', 'B', '?', '*', 'U', 'X', 'P', 'o', '=', '^']);
const ENEMY_COLORS = ['#8e6cf0', '#2bb5a0', '#ef5d5d', '#ffa53a', '#3fa4f5', '#ec4f8c', '#a47551', '#5fbf5a', '#c05ad8', '#25b8d8'];
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const TAU = Math.PI * 2;

const HERO_OUTFIT = { shirt: '#ffd3e2', shirtDark: '#f3a9c4', pants: '#2a9d8f', shoe: '#ffffff', sole: '#ff6f95', skin: '#d9a27c', cap: '#e8333f', capDark: '#b51f2b', overalls: true };
const ME_OUTFIT   = { shirt: '#2f3f9e', shirtDark: '#1f2c78', pants: '#2d2d3a', shoe: '#5b3a24', sole: '#3a2416', skin: '#c48a5f', cap: null, overalls: false };

const THEMES = {
  day: {
    night: false, skyTop: '#47b0ff', skyBottom: '#cdeeff',
    cloud: '#ffffff', cloudShade: '#d8ecfb',
    far: '#a3dd92', farLight: '#bfeaae', near: '#63c060', nearLight: '#7fd178', tree: '#3d9a44', trunk: '#8a5a33',
    grass: '#5cc93a', grassLight: '#8ee35f', dirt: '#b8733c', dirtDark: '#8f552a', dirtLight: '#d18c52',
    brick: '#c9572d', brickLight: '#e57b4e', brickDark: '#8e3517', mortar: '#f0c39a',
    block: '#ffbf2e', blockLight: '#ffd968', blockDark: '#c67c0c', glyph: '#fff7e0',
    used: '#a37b58', usedDark: '#6f5139',
    stone: '#a9b1bb', stoneLight: '#d2d8de', stoneDark: '#6e7782',

    castle: '#e3ad70', castleLight: '#f3c995', castleDark: '#a8723f', castleLine: '#c08a52', door: '#3a2416', window: '#3a2416',
    mover: '#c4874d', moverLight: '#e8b57c', moverDark: '#7f5129',
  },
  night: {
    night: true, skyTop: '#060a26', skyBottom: '#2e2c78',
    cloud: 'rgba(150,160,240,0.20)', cloudShade: 'rgba(110,120,210,0.14)',
    far: '#252c66', farLight: '#323b80', near: '#181e4a', nearLight: '#232a5c', tree: '#0f1436', trunk: '#0f1436',
    grass: '#3a9d7f', grassLight: '#62c9a6', dirt: '#4b3d6b', dirtDark: '#352a50', dirtLight: '#5f4f85',
    brick: '#7b4fa8', brickLight: '#9c70c9', brickDark: '#4d2d72', mortar: '#c3a9e8',
    block: '#ffb84a', blockLight: '#ffd27a', blockDark: '#b9720f', glyph: '#fff7e0',
    used: '#5f5277', usedDark: '#3f3554',
    stone: '#6f7aa6', stoneLight: '#98a2cc', stoneDark: '#454e78',
    pipe: '#6a5fd6', pipeLight: '#a59bff', pipeDark: '#4f45b8', pipeLine: '#241e66',
    plat: '#8a6bd1', platLight: '#b9a1ff', platDark: '#4f3b8f',
    spike: '#d7dcff', spikeDark: '#7d84b8',
    bush: '#245e57', bushLight: '#3a8a7d', flowerA: '#7df9ff', flowerB: '#ffd6ff',
    castle: '#6a5f96', castleLight: '#8478b3', castleDark: '#463d6c', castleLine: '#574d86', door: '#1a1430', window: '#ffd66b',
    mover: '#8a6bd1', moverLight: '#c6b4ff', moverDark: '#4f3b8f',
  },
};

/* ============================================================================
   4) SMALL HELPERS
   ============================================================================ */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const pad = (n, len) => String(Math.max(0, Math.floor(n))).padStart(len, '0');
const $ = (id) => document.getElementById(id);
function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function heartPath(g, x, y, s) {
  g.beginPath(); g.moveTo(x, y + s * 0.9);
  g.bezierCurveTo(x - s * 1.25, y + s * 0.05, x - s * 0.95, y - s * 0.95, x, y - s * 0.35);
  g.bezierCurveTo(x + s * 0.95, y - s * 0.95, x + s * 1.25, y + s * 0.05, x, y + s * 0.9);
  g.closePath();
}
function overlap(a, b, m) {
  m = m || 0;
  return a.x + m < b.x + b.w - m && a.x + a.w - m > b.x + m && a.y + m < b.y + b.h - m && a.y + a.h - m > b.y + m;
}
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } },
};
let best = parseInt(store.get('loverun.best', '0'), 10) || 0;
function saveBest() { if (G.score > best) { best = G.score; store.set('loverun.best', String(best)); } }

/* ============================================================================
   5) SOUND (Web Audio, generated, no files)
   ============================================================================ */
const Sfx = (() => {
  let ac = null, master = null, noiseBuf = null;
  let muted = store.get('loverun.muted', '0') === '1';
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ac = new AC(); } catch (e) { ac = null; return; }
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.55; master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.5), ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    if (ac.state === 'suspended') ac.resume().catch(() => {});
  }
  function ok() { return ac && !muted && ac.state === 'running'; }
  function tone(f, dur, o) {
    if (!ok()) return;
    o = o || {};
    const t0 = ac.currentTime + (o.at || 0), vol = o.vol || 0.12;
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(f, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + (o.attack || 0.006));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(master); osc.start(t0); osc.stop(t0 + dur + 0.03);
  }
  function noise(dur, o) {
    if (!ok()) return;
    o = o || {};
    const t0 = ac.currentTime + (o.at || 0);
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = o.freq || 1500;
    g.gain.setValueAtTime(o.vol || 0.2, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(master); src.start(t0); src.stop(t0 + dur + 0.02);
  }
  return {
    init,
    get muted() { return muted; },
    setMuted(m) { muted = !!m; store.set('loverun.muted', muted ? '1' : '0'); if (master) master.gain.value = muted ? 0 : 0.55; },
    jump() { tone(300, 0.17, { to: 760, vol: 0.09 }); },
    coin() { tone(1046, 0.07, { vol: 0.08 }); tone(1568, 0.28, { vol: 0.08, at: 0.065 }); },
    stomp() { tone(260, 0.14, { to: 70, vol: 0.16 }); noise(0.08, { vol: 0.12, freq: 900 }); },
    bump() { tone(150, 0.09, { type: 'triangle', to: 90, vol: 0.3 }); },
    brk() { noise(0.22, { vol: 0.25, freq: 2200 }); tone(200, 0.12, { to: 60, vol: 0.08 }); },
    item() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.12, { vol: 0.08, at: i * 0.06, type: 'triangle' })); },
    oneUp() { [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, 0.14, { vol: 0.07, at: i * 0.07 })); tone(1568, 0.35, { vol: 0.07, at: 0.35, type: 'triangle' }); },
    die() {
      [494, 349, 294].forEach((f, i) => tone(f, 0.13, { vol: 0.09, at: i * 0.14 }));
      tone(260, 0.55, { to: 55, vol: 0.1, at: 0.45, type: 'triangle' });
    },

        case 'C': out.checkpoints.push({ x: x * TILE + TILE / 2, y: (y + 1) * TILE }); t = '.'; break;
        case 'G': out.goal = { x: x * TILE + TILE / 2, tx: x, baseY: y * TILE, topY: Math.max(TILE * 0.5, (y - 9) * TILE) }; t = 'X'; break;

function tileAt(tx, ty) { return (ty < 0 || ty >= ROWS || tx < 0 || tx >= G.W) ? '.' : G.tiles[ty][tx]; }

    if (p.vy >= 0 && p.x + p.w > pl.x + 2 && p.x < pl.x + pl.w - 2 && p.prevBottom <= pl.y + 3 && p.y + p.h >= pl.y) {
      p.y = pl.y - p.h; p.vy = 0; p.onGround = true; p.onPlatform = pl;
    }
  }
  if (p.onGround) G.stompCombo = 0;
  if (p.invuln > 0) p.invuln -= dt;
  // pickups + hazards
  const tx0 = Math.floor(p.x / TILE), tx1 = Math.floor((p.x + p.w - 0.01) / TILE);
  const ty0 = Math.floor(p.y / TILE), ty1 = Math.floor((p.y + p.h - 0.01) / TILE);
  for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
    const ch = tileAt(tx, ty);
    if (ch === 'o') { G.tiles[ty][tx] = '.'; collectCoin(tx * TILE + 16, ty * TILE + 16, false); }
    else if (ch === '^' && p.invuln <= 0) {
      if (p.x + 2 < tx * TILE + 28 && p.x + p.w - 2 > tx * TILE + 4 && p.y + p.h - 1 > ty * TILE + 16) killPlayer('spike');
    }
  }
  // fell into a pit
  if (p.y > ROWS * TILE + 30) killPlayer('pit');
  // animation
  if (!p.onGround) p.pose = p.vy < 0 ? 'jump' : 'fall';
  else if (Math.abs(p.vx) > 8) { p.pose = 'run'; p.phase += Math.abs(p.vx) * dt * 0.075; }
  else p.pose = 'idle';
}

function updateEnemies(dt) {
  const right = G.camX + viewW + 48, left = G.camX - 160;
  for (const e of G.enemies) {
    if (e.removed) continue;
    if (!e.active) { if (e.x < right && e.x + e.w > left) e.active = true; else continue; }
    if (e.squashT > 0) { e.squashT -= dt; if (e.squashT <= 0) e.removed = true; continue; }
    if (e.flipped) {
      e.vy += 2000 * dt; e.y += e.vy * dt; e.x += e.vx * dt;
      if (e.y > ROWS * TILE + 100) e.removed = true;
      continue;
    }
    e.phase += dt * (e.type === 'F' ? 16 : 9);
    if (e.type === 'J') {
      e.hopT -= dt;
      if (e.onGround && e.hopT <= 0) { e.vy = -540; e.onGround = false; e.hopT = 1.3 + Math.random() * 0.8; }
    }
    if (!(e.type === 'J' && !e.onGround)) {
      if (moveX(e, e.dir * ENEMY_SPEED[e.type] * dt)) e.dir *= -1;
    }
    e.vy = Math.min(e.vy + 2200 * dt, 900);
    e.onGround = moveY(e, e.vy * dt) === 'floor';
    if (e.onGround) {
      const fx = e.dir > 0 ? e.x + e.w + 2 : e.x - 2;
      const ftx = Math.floor(fx / TILE), fty = Math.floor((e.y + e.h + 2) / TILE);
      if (!isSolid(ftx, fty) && !isOneWay(ftx, fty)) e.dir *= -1;
    }
    if (e.y > ROWS * TILE + 60) e.removed = true;
  }
  // enemies bump into each other
  const list = G.enemies;
  for (let i = 0; i < list.length; i++) {
    const a = list[i];
    if (!a.active || a.removed || a.squashT > 0 || a.flipped) continue;
    for (let j = i + 1; j < list.length; j++) {
      const b = list[j];
      if (!b.active || b.removed || b.squashT > 0 || b.flipped) continue;
      if (overlap(a, b, 2)) { if (a.x < b.x) { a.dir = -1; b.dir = 1; } else { a.dir = 1; b.dir = -1; } }
    }
  }
}

function playerVsEnemies() {
  const p = G.player, inp = readInput();
  for (const e of G.enemies) {
    if (!e.active || e.removed || e.squashT > 0 || e.flipped) continue;
    if (!overlap(p, e, 3)) continue;
    const stomp = p.vy > 0 && (p.prevBottom <= e.y + 18 || p.y + p.h - e.y < 20);
    if (stomp) {
      squashEnemy(e);
      p.vy = -(inp.jump ? PHYS.stompHeld : PHYS.stomp); p.jumping = inp.jump; p.onGround = false;
    } else if (p.invuln <= 0) {
      killPlayer('enemy');
      return;
    }
  }
}

function updateItems(dt) {
  const p = G.player;
  for (const it of G.items) {
    if (it.removed) continue;
    if (it.emerge < 1) { it.emerge = Math.min(1, it.emerge + dt * 2.2); it.y = it.baseY + (1 - it.emerge) * 20; continue; }
    if (moveX(it, 70 * it.dir * dt)) it.dir *= -1;
    it.vy = Math.min(it.vy + 1800 * dt, 700);
    it.onGround = moveY(it, it.vy * dt) === 'floor';
    if (it.y > ROWS * TILE + 40) it.removed = true;
    if (G.state === 'play' && overlap(p, it, 0)) { it.removed = true; gainLife(it.x + it.w / 2, it.y); }
  }
  G.items = G.items.filter((it) => !it.removed);
}

function updateParticles(dt) {
  const arr = G.particles;
  let j = 0;
  for (let i = 0; i < arr.length; i++) {
    const q = arr[i];
    q.life -= dt;
    if (q.life <= 0) continue;
    if (q.g) q.vy += q.g * dt;
    q.x += q.vx * dt; q.y += q.vy * dt;
    if (q.type === 'heart' || q.type === 'confetti') q.x += Math.sin(q.life * 3 + q.p) * 18 * dt;
    if (q.vr) q.rot += q.vr * dt;
    arr[j++] = q;
  }
  arr.length = j;
  for (const [key, t] of G.bumps) { const nt = t + dt; if (nt > 0.22) G.bumps.delete(key); else G.bumps.set(key, nt); }
}

function updateCamera(dt, snap) {
  const p = G.player;
  if (!p) return;
  const maxX = Math.max(0, G.W * TILE - viewW);
  G.look += ((p.face * 40) - G.look) * (snap ? 1 : 1 - Math.exp(-dt * 2.5));
  const target = clamp(p.x + p.w / 2 - viewW * 0.42 + G.look, 0, maxX);
  G.camX = snap ? target : G.camX + (target - G.camX) * (1 - Math.exp(-dt * 8));
  G.camX = clamp(G.camX, 0, maxX);
}

function checkProgress() {
  const p = G.player;
  for (const c of G.checkpoints) {
    if (!c.reached && p.x + p.w / 2 >= c.x) {
      c.reached = true; c.t = 0;
      G.respawn = { x: c.x - PW / 2, y: c.y - PH };
      Sfx.checkpoint(); popText('CHECKPOINT!', c.x, c.y - 80, '#ffe680'); burstHearts(c.x, c.y - 60, 8, 30);
    }
  }
  const goal = G.goal;
  if (goal && (p.x + p.w >= goal.x - 3 || (p.x + p.w >= goal.tx * TILE - 1 && p.y + p.h > goal.baseY + 2))) startFlag();
}

/* ---------- goal: flagpole -> walk to castle -> meet ---------- */
function startFlag() {
  const p = G.player, goal = G.goal;
  G.state = 'flag';
  const onBase = p.y + p.h <= goal.baseY + 2;
  const frac = clamp((goal.baseY - (p.y + p.h)) / (goal.baseY - goal.topY), 0, 1);
  const bonus = onBase ? (frac >= 0.97 ? 5000 : 100 + Math.round(frac * 39) * 100) : 100;
  p.vx = 0; p.vy = 0; p.jumping = false; p.onPlatform = null;
  if (onBase) { p.x = goal.x - p.w + 3; p.y = Math.max(p.y, goal.topY - 8); p.face = 1; }
  addScore(bonus, goal.x + 18, Math.max(goal.topY + 10, p.y));
  G.flag = { phase: onBase ? 'slide' : 'turn', t: 0, flagY: goal.topY + 6, me: 0, jumped: false, onBase, heartT: 0, bigHeart: false, done: false };
  Sfx.flag();
}
function updateFlag(dt) {
  const F = G.flag, p = G.player, goal = G.goal;
  F.t += dt;
  const flagBottom = goal.baseY - 30;
  if (F.flagY < flagBottom) F.flagY = Math.min(flagBottom, F.flagY + 300 * dt);
  if (F.phase === 'slide') {
    p.pose = 'slide';
    p.y = Math.min(goal.baseY - p.h, p.y + 300 * dt);
    if (p.y >= goal.baseY - p.h && F.flagY >= flagBottom) { F.phase = 'turn'; F.t = 0; p.x = goal.x + 2; p.face = -1; p.onGround = true; }
    return;
  }
  if (F.phase === 'turn') {
    p.pose = F.onBase ? 'slide' : 'idle';
    if (F.t > 0.4 && F.flagY >= flagBottom) { F.phase = 'walk'; F.t = 0; p.face = 1; }
    return;
  }
  if (F.phase === 'walk') {
    p.vx = 135;
    const target = G.castle ? G.castle.doorX - 46 : goal.x + 200;
    if (p.x + p.w / 2 >= target) { p.vx = 0; F.phase = 'meet'; F.t = 0; Sfx.win(); }
  }
  if (moveX(p, p.vx * dt) && p.onGround) p.vy = -520;       // hop over the flag base
  p.vy = Math.min(p.vy + PHYS.gDown * dt, PHYS.maxFall);
  p.onGround = moveY(p, p.vy * dt) === 'floor';
  p.pose = !p.onGround ? (p.vy < 0 ? 'jump' : 'fall') : (p.vx ? 'run' : 'idle');
  if (p.vx) p.phase += p.vx * dt * 0.075;
  if (p.y > ROWS * TILE) { p.y = goal.baseY - p.h; p.vy = 0; }
  if (F.phase === 'meet') updateMeet(dt);
}
function updateMeet(dt) {
  const F = G.flag, p = G.player, c = G.castle;
  F.me = Math.min(1, F.t / 0.6);
  // time bonus tally
  if (G.timeLeft > 0 && F.t > 0.4) {
    const amt = Math.min(G.timeLeft, 160 * dt);
    G.timeLeft -= amt; G.tallyAcc += amt;
    while (G.tallyAcc >= 1) { G.score += 10; G.tallyAcc -= 1; }
    if (G.timeLeft < 0.999) { G.timeLeft = 0; G.tallyAcc = 0; }
    G.tickT -= dt; if (G.tickT <= 0) { G.tickT = 0.06; Sfx.tick(); }
  }
  if (F.t > 0.7 && !F.jumped && p.onGround) { p.vy = -420; p.onGround = false; F.jumped = true; Sfx.pop(); }
  const mx = c ? c.doorX - 23 : p.x + 30, my = c ? c.y - 56 : p.y;
  F.heartT -= dt;
  if (F.t > 0.45 && F.heartT <= 0) { F.heartT = (G.state === 'flag') ? 0.09 : 0.22; burstHearts(mx, my, 1, 50); }
  if (F.t > 1.0 && !F.bigHeart) { F.bigHeart = true; addP({ type: 'bigheart', x: mx, y: my - 30, vx: 0, vy: -12, life: 2.4, max: 2.4 }); }
  if (F.t > 2.8 && G.timeLeft <= 0 && !F.done) { F.done = true; onLevelComplete(); }
}
function onLevelComplete() {
  saveBest();
  const last = G.levelIndex >= LEVELS.length - 1;
  if (last) { G.state = 'won'; showWin(); } else { G.state = 'clear'; showLevelClear(); }
}

/* ---------- main update ---------- */
function update(dt) {
  G.time += dt;
  switch (G.state) {
    case 'title': {
      updatePlatforms(dt);
      const maxX = Math.max(0, G.W * TILE - viewW);
      G.camX += 38 * dt * G.panDir;
      if (G.camX >= maxX) { G.camX = maxX; G.panDir = -1; } else if (G.camX <= 0) { G.camX = 0; G.panDir = 1; }
      updateEnemies(dt); updateParticles(dt);
      break;
    }
    case 'play':
      updatePlatforms(dt);
      updatePlayer(dt);
      if (G.state !== 'play') break;
      updateEnemies(dt);
      playerVsEnemies();
      if (G.state !== 'play') break;
      updateItems(dt);
      checkProgress();
      updateParticles(dt);
      updateCamera(dt, false);
      if (G.state === 'play') { G.timeLeft -= dt; if (G.timeLeft <= 0) { G.timeLeft = 0; killPlayer('time'); } }
      break;
    case 'dying': {
      G.deathT += dt;
      const p = G.player;
      if (G.deathT > 0.45) { p.vy = Math.min(p.vy + 2000 * dt, 1200); p.y += p.vy * dt; }
      updateParticles(dt);
      if (G.deathT > 2.1) afterDeath();
      break;
    }
    case 'flag':
      updatePlatforms(dt); updateEnemies(dt); updateItems(dt);
      updateFlag(dt); updateParticles(dt); updateCamera(dt, false);
      break;
    case 'clear': case 'won':
      if (G.flag) { G.flag.t += dt; updateMeet(dt); }
      { const p = G.player; p.vy = Math.min(p.vy + PHYS.gDown * dt, PHYS.maxFall); p.onGround = moveY(p, p.vy * dt) === 'floor'; p.pose = p.onGround ? 'idle' : 'jump'; }
      if (G.state === 'won' && Math.random() < dt * 14) {
        addP({ type: 'heart', x: G.camX + Math.random() * viewW, y: ROWS * TILE + 10, vx: 0, vy: -70 - Math.random() * 90,
          life: 5, max: 5, s: 5 + Math.random() * 7, p: Math.random() * TAU, c: ['#ff4d79', '#ff8fb0', '#ffd1dc', '#ff2d55'][Math.floor(Math.random() * 4)] });
      }
      updateParticles(dt);
      break;
    default:
      updateParticles(dt);
  }
  if (G.banner) { G.banner.t += dt; if (G.banner.t > G.banner.dur) G.banner = null; }
  for (const c of G.checkpoints) if (c.reached) c.t += dt;
}

function drawPerson(g, x, y, o) {
  const d = o.dir >= 0 ? 1 : -1, out = o.outfit, r = o.r || 17;
  let bob = 0, lf = 0, lb = 0, af = 0, ab = 0, tilt = 0;
  switch (o.pose) {

    case 'jump': lf = 0.95; lb = -0.45; af = 2.6; ab = -0.7; tilt = -d * 0.08; break;

function drawTiles() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);

            const h = (Math.imul(tx ^ (tx >>> 3) ^ 0x5bd1e995, 2654435761) >>> 8) % 100;

function drawCastle(g) {

function drawHUD() {

  let x = left + step * 1.15;
  ctx.drawImage(atlas, (TI.coin0 + Math.floor(G.time * 6) % 4) * tilePx, 0, tilePx, tilePx, x, y - fs * 0.75, fs * 1.5, fs * 1.5);

let last = performance.now(), perfAcc = 0, perfN = 0, lastPortrait = false, lastPauseVisible = null;
function perfCheck(dt) {
  if (G.state !== 'play' || G.paused) { perfAcc = 0; perfN = 0; return; }
  perfAcc += dt; perfN++;
  if (perfN >= 150) {
    const avg = perfAcc / perfN; perfAcc = 0; perfN = 0;
    if (avg > 0.026 && dpr > 1.05) { quality = Math.max(0.4, quality * 0.8); needResize = true; }
  }
}
function frame(now) {
  requestAnimationFrame(frame);
  if (needResize) resize();
  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0)) dt = 0;
  if (dt > 0.1) dt = 0.1;
  const portrait = portraitMQ.matches;
  if (portrait && !lastPortrait) { clearInput(); }
  lastPortrait = portrait;
  if (!G.paused && !portrait && dt > 0) {
    perfCheck(dt);
    const n = Math.ceil(dt / MAX_STEP), h = dt / n;
    for (let i = 0; i < n; i++) update(h);
  }
  const pv = canPause() && !G.paused;
  if (pv !== lastPauseVisible) { lastPauseVisible = pv; syncTopButtons(); }
  render();
}

/* ============================================================================
   17) BOOT
   ============================================================================ */
document.title = GAME_TITLE;
resize();
syncTopButtons();
showScreen({ title: GAME_TITLE, sub: 'Loading…', btn1: 'Loading…', btn1Disabled: true });
requestAnimationFrame(frame);
loadAllFaces().catch(() => {}).then(() => {
  if (!faces.hero) faces.hero = buildFace(null, NAMES.hero, '#ff5a7a');
  if (!faces.me) faces.me = buildFace(null, NAMES.me, '#4a6cf7');
  if (!faces.enemies.length) faces.enemies.push(buildFace(null, 'Bo', ENEMY_COLORS[0]));
  showTitle();
});

// Small hook used by automated tests (harmless for players).
window.__loveRun = {
  G, bot, isSolid, isOneWay, LEVELS,
  get viewW() { return viewW; },
  startGame, startLevel,
  simulate(seconds, botFn, until) {
    const steps = Math.round(seconds / MAX_STEP);
    const stop = until || ((g) => g.state !== 'play' && g.state !== 'flag');
    for (let i = 0; i < steps; i++) { if (botFn) botFn(this); update(MAX_STEP); if (stop(G)) break; }
    return G.state;
  },
};
})();
</script>
