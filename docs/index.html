<html lang="en">

<meta name="theme-color" content="#1b1440">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="A tiny platformer made with love.">
<title>Super Love Run</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #120b2a; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #game { position: fixed; left: 0; top: 0; display: block; touch-action: none; }
  #safe {
    position: fixed; inset: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }

  /* ---------- overlay screens ---------- */
  #screen {
    position: fixed; inset: 0; z-index: 10; display: none;
    align-items: center; justify-content: center;
    padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: radial-gradient(ellipse at center, rgba(40, 14, 70, .45), rgba(12, 6, 32, .82));
  }
  #screen.show { display: flex; animation: fadeIn .3s ease-out; }
  #screen.see-through { background: radial-gradient(ellipse at center, rgba(40, 14, 70, .30), rgba(12, 6, 32, .55)); }
  .card {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    gap: clamp(4px, 1.8vh, 14px); max-width: min(94vw, 760px); max-height: 100%;
  }
  #s-title {
    margin: 0; font-weight: 900; line-height: 1.02; letter-spacing: .5px;
    font-size: clamp(28px, 12vh, 86px);
    text-shadow: 0 3px 0 #e2346a, 0 6px 0 #7a1747, 0 12px 22px rgba(0, 0, 0, .5);
  }
  #s-title.win { font-size: clamp(30px, 14vh, 96px); animation: pop .6s cubic-bezier(.2, 1.6, .4, 1) both; }
  .sub { margin: 0; font-weight: 800; font-size: clamp(14px, 4.6vh, 24px); text-shadow: 0 2px 6px rgba(0, 0, 0, .6); }
  .stats { font-weight: 800; font-size: clamp(12px, 3.8vh, 18px); opacity: .95; text-shadow: 0 2px 4px rgba(0, 0, 0, .6); }
  .hint { margin: 0; font-size: clamp(11px, 3.2vh, 14px); opacity: .85; text-shadow: 0 1px 3px rgba(0, 0, 0, .7); }
  .faces { display: flex; align-items: center; gap: clamp(6px, 2vw, 16px); }
  .face {
    width: clamp(54px, 22vh, 130px); height: clamp(54px, 22vh, 130px); border-radius: 50%;
    object-fit: cover; border: 4px solid #fff; box-shadow: 0 6px 18px rgba(0, 0, 0, .45);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: clamp(18px, 7vh, 40px); color: #fff; background: #ff5a7a;
  }
  .face.cut {
    width: auto; height: clamp(64px, 27vh, 160px); border: 0; border-radius: 0; background: none;
    box-shadow: none; object-fit: contain; filter: drop-shadow(0 6px 12px rgba(0, 0, 0, .5));
  }
  .heartbeat { font-size: clamp(26px, 10vh, 60px); animation: beat .9s ease-in-out infinite; line-height: 1; }
  .btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: clamp(2px, 1vh, 8px); }
  .btn {
    appearance: none; border: 0; border-radius: 999px; cursor: pointer; touch-action: manipulation;
    padding: clamp(10px, 3.2vh, 16px) clamp(22px, 6vw, 42px); color: #fff;
    font: 900 clamp(16px, 5.2vh, 26px)/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #ff7aa0, #ff3d6e);
    box-shadow: 0 5px 0 #b3204a, 0 10px 22px rgba(0, 0, 0, .35);
    transition: transform .08s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b3204a, 0 6px 14px rgba(0, 0, 0, .35); }
  .btn.secondary { background: linear-gradient(180deg, #8a7cff, #5a4ae0); box-shadow: 0 5px 0 #3a2ea3, 0 10px 22px rgba(0, 0, 0, .35); }
  .btn[disabled] { opacity: .6; cursor: default; }
  .btn.pulse { animation: pulse 1.4s ease-in-out infinite; }

  /* ---------- top-right buttons ---------- */
  #topbtns {
    position: fixed; z-index: 20; display: flex; gap: 8px;
    top: max(8px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right));
  }
  .icon-btn {
    width: clamp(36px, 10vh, 48px); height: clamp(36px, 10vh, 48px); border-radius: 50%; padding: 0;
    border: 2px solid rgba(255, 255, 255, .75); background: rgba(0, 0, 0, .3); color: #fff;
    display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: manipulation;
  }
  .icon-btn svg { width: 58%; height: 58%; }
  #btnMute.muted .waves { display: none; }
  #btnMute:not(.muted) .mutex { display: none; }

  /* ---------- rotate prompt ---------- */
  #rotate {
    position: fixed; inset: 0; z-index: 50; display: none; flex-direction: column; gap: 22px;
    align-items: center; justify-content: center; text-align: center; padding: 24px;
    background: linear-gradient(180deg, #2a1b5e, #120b2a); font-weight: 800; font-size: 20px;
  }
  .phone { width: 58px; height: 98px; border: 5px solid #fff; border-radius: 14px; position: relative; animation: rot 2s ease-in-out infinite; }
  .phone::after { content: ""; position: absolute; left: 50%; bottom: 5px; width: 12px; height: 4px; margin-left: -6px; border-radius: 2px; background: #fff; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }

  @keyframes rot { 0%, 15% { transform: rotate(0); } 50%, 80% { transform: rotate(-90deg); } 100% { transform: rotate(0); } }
  @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
  @keyframes fadeIn { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
</style>
</head>

<canvas id="game" aria-label="Game"></canvas>
<div id="safe"></div>

<div id="topbtns">
  <button id="btnPause" class="icon-btn" aria-label="Pause" hidden>

  </button>
  <button id="btnMute" class="icon-btn" aria-label="Mute sound">

</div>

// How far the drawn head sticks up above an enemy's hitbox (cut-out faces are tall).
function headExtra(e) {
  if (e.type === 'Y' || (e.type === 'T' && e.state !== 'walk')) return 0;
  const f = faces.enemies[e.faceIdx % Math.max(1, faces.enemies.length)];
  const a = f ? f.aspect : 1;
  return e.type === 'T' ? Math.max(0, (19 + 27 * a) * ENEMY_SCALE - e.h) : Math.max(0, (16 + 30 * a) * ENEMY_SCALE - e.h);
}
function playerVsEnemies() {
  const p = G.player, inp = readInput();
  const bounce = () => { p.vy = -(inp.jump ? PHYS.stompHeld : PHYS.stomp); p.jumping = inp.jump; p.onGround = false; p.stompGrace = 0.15; };
  for (const e of G.enemies) {
    if (!alive(e)) continue;
    const b = enemyBox(e);
    if (!b) continue;
    // Generous "head" box (includes the drawn head, a bit wider) for stomps and kicks,
    // and a smaller "body" box for getting hurt, so touching the side of a head doesn't kill her.
    const ex = headExtra(e), top = b.y - ex, fullH = b.h + ex;
    const headBox = { x: b.x - 6, y: top, w: b.w + 12, h: fullH };
    if (!overlap(p, headBox, 0)) continue;
    if (p.megaT > 0) { G.megaCombo++; killEnemy(e, Math.min(8000, 200 * G.megaCombo)); continue; }
    const hurtBox = { x: b.x + 5, y: b.y + 8, w: Math.max(6, b.w - 10), h: Math.max(6, b.h - 8) };
    const hurts = overlap(p, hurtBox, 0) && p.stompGrace <= 0;
    const midY = top + fullH * 0.55;
    const stomp = p.vy > 0 && (p.prevBottom <= midY || p.y + p.h <= midY);
    if (e.type === 'Y') { if (hurts) { hurtPlayer('enemy'); if (G.state !== 'play') return; } continue; }
    if (e.type === 'T' && e.state === 'shell') { kickShell(e, p); if (stomp) bounce(); continue; }
    if (e.type === 'T' && e.state === 'slide') {
      if (stomp) { e.state = 'shell'; e.shellT = 0; Sfx.stomp(); bounce(); continue; }
      if (e.kickGrace > 0 || !hurts) continue;
      hurtPlayer('enemy'); if (G.state !== 'play') return; continue;
    }
    if (stomp) {
      if (e.type === 'T') { toShell(e); Sfx.stomp(); awardAt(stompPoints(), e.x + e.w / 2, e.y - 10); }
      else if (e.type === 'W' && e.winged) { e.winged = false; e.vy = 0; Sfx.stomp(); awardAt(stompPoints(), e.x + e.w / 2, e.y - 10); puff(e.x + e.w / 2, e.y + 10, 6); }
      else squashEnemy(e);
      bounce();
    } else if (hurts) {
      hurtPlayer('enemy');
      if (G.state !== 'play') return;
    }
  }
}

function updateItems(dt) {
  const p = G.player;
  for (const it of G.items) {
    if (it.removed) continue;
    if (it.emerge < 1) { it.emerge = Math.min(1, it.emerge + dt * 2.2); it.y = it.baseY + (1 - it.emerge) * 20; continue; }
    if (it.kind !== 'pizza') {

      it.vy = Math.min(it.vy + 1800 * dt, 700);
      it.onGround = moveY(it, it.vy * dt) === 'floor';

    if (G.state === 'play' && overlap(p, it, 0)) {

      if (it.kind === 'heart') gainLife(it.x + it.w / 2, it.y);

function updateParticles(dt) {

    const q = arr[i];
    q.life -= dt;
    if (q.life <= 0) continue;
    if (q.g) q.vy += q.g * dt;
    q.x += q.vx * dt; q.y += q.vy * dt;
    if (q.type === 'heart') q.x += Math.sin(q.life * 3 + q.p) * 18 * dt;
    if (q.vr) q.rot += q.vr * dt;

function updateCamera(dt, snap) {

  const maxX = Math.max(0, G.W * TILE - viewW);
  G.look += ((p.face * 40) - G.look) * (snap ? 1 : 1 - Math.exp(-dt * 2.5));
  const target = clamp(p.x + p.w / 2 - viewW * 0.42 + G.look, 0, maxX);

}

function checkProgress() {
  const p = G.player;
  for (const c of G.checkpoints) {
    if (!c.reached && p.x + p.w / 2 >= c.x) {
      c.reached = true; c.t = 0;
      G.respawn = { x: c.x - PW / 2, y: c.y - PH };
      Sfx.checkpoint(); popText('CHECKPOINT!', c.x, c.y - 80, '#ffe680', 16); burstHearts(c.x, c.y - 60, 8, 30);
    }

  const goal = G.goal;
  if (goal && (p.x + p.w >= goal.x - 3 || (p.x + p.w >= goal.tx * TILE - 1 && p.y + p.h > goal.baseY + 2))) startFlag();
}

/* ---------- goal: flagpole -> walk to castle -> meet ---------- */
function startFlag() {
  const p = G.player, goal = G.goal;
  G.state = 'flag';
  const onBase = p.y + p.h <= goal.baseY + 2;
  const frac = clamp((goal.baseY - (p.y + p.h)) / (goal.baseY - goal.topY), 0, 1);
  const bonus = onBase ? (frac >= 0.97 ? 5000 : 100 + Math.round(frac * 39) * 100) : 100;
  p.vx = 0; p.vy = 0; p.jumping = false; p.onPlatform = null;
  if (onBase) { p.x = goal.x - p.w + 3; p.y = Math.max(p.y, goal.topY - 8); p.face = 1; }
  addScore(bonus, goal.x + 18, Math.max(goal.topY + 10, p.y));
  G.flag = { phase: onBase ? 'slide' : 'turn', t: 0, flagY: goal.topY + 6, me: 0, lean: 0, kissed: false, onBase, heartT: 0, done: false };
  Sfx.flag();
}
function updateFlag(dt) {
  const F = G.flag, p = G.player, goal = G.goal;
  F.t += dt;
  const flagBottom = goal.baseY - 30;
  if (F.flagY < flagBottom) F.flagY = Math.min(flagBottom, F.flagY + 300 * dt);
  p.scaleAnim += (SIZES[p.size][2] - p.scaleAnim) * Math.min(1, dt * 7);
  if (F.phase === 'slide') {
    p.pose = 'slide';
    p.y = Math.min(goal.baseY - p.h, p.y + 300 * dt);
    if (p.y >= goal.baseY - p.h && F.flagY >= flagBottom) { F.phase = 'turn'; F.t = 0; p.x = goal.x + 2; p.face = -1; p.onGround = true; }
    return;
  }
  if (F.phase === 'turn') {
    p.pose = F.onBase ? 'slide' : 'idle';
    if (F.t > 0.4 && F.flagY >= flagBottom) { F.phase = 'walk'; F.t = 0; p.face = 1; }
    return;
  }
  if (F.phase === 'walk') {
    p.vx = 135;
    const target = G.castle ? G.castle.doorX - 46 - (p.size === 'big' ? 10 : 0) : goal.x + 200;
    if (p.x + p.w / 2 >= target) { p.vx = 0; F.phase = 'meet'; F.t = 0; Sfx.win(); }
  }
  if (moveX(p, p.vx * dt) && p.onGround) p.vy = -520;       // hop over the flag base
  p.vy = Math.min(p.vy + PHYS.gDown * dt, PHYS.maxFall);
  p.onGround = moveY(p, p.vy * dt) === 'floor';
  p.pose = !p.onGround ? (p.vy < 0 ? 'jump' : 'fall') : (p.vx ? 'run' : 'idle');
  if (p.vx) p.phase += p.vx * dt * 0.075;
  if (p.y > ROWS * TILE) { p.y = goal.baseY - p.h; p.vy = 0; }
  if (F.phase === 'meet') updateMeet(dt);
}
function updateMeet(dt) {

  if (G.timeLeft > 0 && F.t > 0.4) {

    while (G.tallyAcc >= 1) { G.score += 10; G.tallyAcc -= 1; }
    if (G.timeLeft < 0.999) { G.timeLeft = 0; G.tallyAcc = 0; }

  if (F.t > 0.7 && p.x + p.w / 2 < kissX - 1) { moveX(p, Math.min(90 * dt, kissX - (p.x + p.w / 2))); p.face = 1; if (p.onGround) { p.pose = 'run'; p.phase += 90 * dt * 0.075; } }

    burstHearts(mx, my, 12, 36);

}
function onLevelComplete() {

  const last = G.levelIndex >= LEVELS.length - 1;
  if (last) { saveProgress(0, 0); G.state = 'won'; showWin(); } else { saveProgress(G.levelIndex + 1, G.score); G.state = 'clear'; showLevelClear(); }

/* ---------- main update ---------- */
function update(dt) {
  G.time += dt;
  switch (G.state) {
    case 'title': {
      updatePlatforms(dt);
      const maxX = Math.max(0, G.W * TILE - viewW);
      G.camX += 38 * dt * G.panDir;
      if (G.camX >= maxX) { G.camX = maxX; G.panDir = -1; } else if (G.camX <= 0) { G.camX = 0; G.panDir = 1; }
      updateEnemies(dt); updateParticles(dt);
      break;
    }
    case 'play':
      updatePlatforms(dt);
      updatePlayer(dt);
      if (G.state !== 'play') break;
      updateEnemies(dt);
      updateBoss(dt);
      updateFireballs(dt);
      playerVsEnemies();
      if (G.state === 'play') playerVsBoss();
      if (G.state !== 'play') break;
      updateItems(dt);
      checkProgress();
      updateParticles(dt);
      updateCamera(dt, false);
      if (G.state === 'play') { G.timeLeft -= dt; if (G.timeLeft <= 0) { G.timeLeft = 0; killPlayer('time'); } }
      break;
    case 'dying': {
      G.deathT += dt;
      const p = G.player;
      if (G.deathT > 0.45) { p.vy = Math.min(p.vy + 2000 * dt, 1200); p.y += p.vy * dt; }
      updateParticles(dt);
      if (G.deathT > 2.1) afterDeath();
      break;
    }
    case 'flag':
      updatePlatforms(dt); updateEnemies(dt); updateItems(dt); updateFireballs(dt);
      updateFlag(dt); updateParticles(dt); updateCamera(dt, false);
      break;
    case 'clear': case 'won':
      if (G.flag) { G.flag.t += dt; updateMeet(dt); }
      { const p = G.player; p.vy = Math.min(p.vy + PHYS.gDown * dt, PHYS.maxFall); p.onGround = moveY(p, p.vy * dt) === 'floor'; p.pose = p.onGround ? 'idle' : 'jump'; }
      if (G.state === 'won' && Math.random() < dt * 14) {
        addP({ type: 'heart', x: G.camX + Math.random() * viewW, y: ROWS * TILE + 10, vx: 0, vy: -70 - Math.random() * 90,
          life: 5, max: 5, s: 5 + Math.random() * 7, p: Math.random() * TAU, c: ['#ff4d79', '#ff8fb0', '#ffd1dc', '#ff2d55'][Math.floor(Math.random() * 4)] });
      }
      updateParticles(dt);
      break;
    default:
      updateParticles(dt);
  }
  if (G.banner) { G.banner.t += dt; if (G.banner.t > G.banner.dur) G.banner = null; }
  for (const c of G.checkpoints) if (c.reached) c.t += dt;
}

        g.lineWidth = 3.5; g.strokeStyle = 'rgba(40,10,40,0.75)'; g.strokeText('MWAH!', q.x, q.y - 16 * sc);
        g.fillStyle = '#ff8fb0'; g.fillText('MWAH!', q.x, q.y - 16 * sc);
        break;
      }
      case 'bigheart': {
        const age = q.max - q.life, sc = Math.min(1, age / 0.35) * (1 + Math.sin(age * 9) * 0.06);
        g.globalAlpha = Math.min(1, a * 2);
        g.fillStyle = '#c2183f'; heartPath(g, q.x, q.y + 1.5, 17 * sc); g.fill();
        g.fillStyle = '#ff3d6e'; heartPath(g, q.x, q.y, 16 * sc); g.fill();
        g.fillStyle = 'rgba(255,255,255,0.65)'; g.beginPath(); g.ellipse(q.x - 6 * sc, q.y - 6 * sc, 4 * sc, 2.4 * sc, -0.6, 0, TAU); g.fill();
        break;
      }
      default: break;
    }
  }
  g.globalAlpha = 1;
}
function drawHero(g, p) {
  if (p.invuln > 0 && p.megaT <= 0 && Math.floor(G.time * 16) % 2) return;
  let sc = p.scaleAnim;
  if (((p.megaT > 0 && p.megaT < 2) || (p.tinyT > 0 && p.tinyT < 1.5)) && Math.floor(G.time * 10) % 2) sc = 1;   // flicker before changing back
  const gr = clamp((sc - 1) / 0.45, 0, 1);
  const cx = p.x + p.w / 2, feet = p.y + p.h;
  if (p.megaT > 0) {
    const pulse = 0.5 + 0.5 * Math.sin(G.time * 10);
    g.globalAlpha = 0.18 + 0.12 * pulse; g.fillStyle = '#ff7aa0';
    g.beginPath(); g.ellipse(cx, feet - p.h * 0.5, p.w * 0.9 + 6, p.h * 0.62, 0, 0, TAU); g.fill();
    g.globalAlpha = 1;
  }
  drawPerson(g, cx, feet, { face: faces.hero, outfit: p.fire ? FIRE_OUTFIT : HERO_OUTFIT, dir: p.face, pose: p.pose, phase: p.phase, t: G.time,
    scale: sc, fat: gr, headW: 32, throwT: p.throwT, lean: p.lean });
}

function drawWorld() {
  const camPx = Math.round(G.camX * k);
  const g = ctx;
  g.setTransform(k, 0, 0, k, -camPx, offY);
  drawCastle(g); drawGoal(g); drawCheckpoints(g); drawItems(g);
  for (const e of G.enemies) if (e.type === 'Y' && e.active) drawPeeper(g, e);
  drawTiles();
  g.setTransform(k, 0, 0, k, -camPx, offY);
  drawPlatforms(g);
  for (const e of G.enemies) {
    if (e.removed || !e.active) continue;
    if (e.x > G.camX + viewW + 40 || e.x + e.w < G.camX - 40) continue;
    drawEnemy(g, e);
  }
  drawBoss(g, G.boss);
  drawFlames(g);
  const F = G.flag, c = G.castle;
  if (F && F.me > 0 && c) {
    g.globalAlpha = F.me;
    drawPerson(g, c.doorX, c.y, { face: faces.me, outfit: ME_OUTFIT, dir: -1, pose: F.lean > 0.3 ? 'idle' : 'wave', t: G.time, scale: 0.6 + 0.4 * F.me, rose: true, headW: 34, lean: F.lean });
    g.globalAlpha = 1;
  }
  const p = G.player;
  if (p && G.state !== 'title') drawHero(g, p);
  drawFireballs(g);
  drawFireflies(g);
  drawParticles(g);
}

function outlined(text, x, y, align, size, color) {
  ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(2, size * 0.22); ctx.strokeStyle = 'rgba(20,8,40,0.7)';
  ctx.strokeText(text, x, y); ctx.fillStyle = color || '#fff'; ctx.fillText(text, x, y);
  return ctx.measureText(text).width;
}
function drawFaceIcon(face, x, cy, h) {
  if (!face) return h;
  const w = h / face.aspect;
  ctx.drawImage(faceAt(face, w), x, cy - h / 2, w, h);
  return w;
}
function drawHUD() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const fs = Math.round(clamp(Math.min(cssH * 0.05, cssW * 0.026), 11, 24) * dpr);
  const y = Math.round((safe.t + 8) * dpr + fs * 0.8);
  const left = (safe.l + 14) * dpr, right = canvas.width - (safe.r + 120) * dpr;
  const step = (right - left) / 5;
  outlined('SCORE ' + pad(G.score, 6), left, y, 'left', fs);
  let x = left + step * 1.15;
  ctx.drawImage(atlas, (TI.coin0 + Math.floor(G.time * 6) % 4) * tilePx, 0, tilePx, tilePx, x, y - fs * 0.75, fs * 1.5, fs * 1.5);
  outlined('×' + pad(G.coins, 2), x + fs * 1.5, y, 'left', fs);
  x = left + step * 2.15;
  const fw = drawFaceIcon(faces.hero, x, y, fs * 1.7);
  x += fw + fs * 0.2;
  x += outlined('×' + G.lives, x, y, 'left', fs) + fs * 0.5;
  const p = G.player;
  const y2 = y + fs * 1.6;
  let px2 = left;
  const bar = (icon, frac, color) => {
    ctx.save(); ctx.translate(px2 + fs * 0.6, y2); ctx.scale(fs / 22, fs / 22); icon(); ctx.restore();
    const bw = fs * 2.4, bx = px2 + fs * 1.35, bh = fs * 0.34;
    ctx.fillStyle = 'rgba(20,8,40,0.6)'; ctx.fillRect(bx, y2 - bh / 2, bw, bh);
    ctx.fillStyle = color; ctx.fillRect(bx, y2 - bh / 2, bw * clamp(frac, 0, 1), bh);
    px2 += fs * 4.3;
  };
  if (p && p.fire) bar(() => drawPizzaIcon(ctx, 0, 0, 1), p.fireT / PIZZA_SECONDS, '#ff9f1c');
  if (p && p.megaT > 0) bar(() => drawCakeIcon(ctx, 0, 0, 1), p.megaT / CAKE_SECONDS, '#ff4d79');
  if (p && p.tinyT > 0) bar(() => drawBroccoliIcon(ctx, 0, 2, 1), p.tinyT / BROCCOLI_SECONDS, '#51cf66');
  const B = G.boss;
  if (B && B.active && !B.dead) {
    const bw = Math.min(canvas.width * 0.3, 280 * dpr), bx = canvas.width / 2 - bw / 2, bh = fs * 0.55, by = y2 + fs * 0.35;
    outlined('DRAGON', canvas.width / 2, y2 - fs * 0.25, 'center', Math.round(fs * 0.8), '#ffd1dc');
    ctx.fillStyle = 'rgba(20,8,40,0.7)'; ctx.fillRect(bx - 3, by - 3, bw + 6, bh + 6);
    ctx.fillStyle = '#ff3d6e'; ctx.fillRect(bx, by, bw * clamp(B.hp / DRAGON_HP, 0, 1), bh);
  }
  outlined('LEVEL ' + (G.levelIndex + 1), left + step * 3.3, y, 'left', fs);
  outlined('TIME ' + pad(Math.ceil(G.timeLeft), 3), left + step * 4.15, y, 'left', fs, G.timeLeft < 60 && G.state === 'play' ? '#ffb3b3' : '#fff');
}
function drawArrow(cx, cy, r, dir) {
  ctx.beginPath();
  if (dir === 'up') { ctx.moveTo(cx, cy - r * 0.45); ctx.lineTo(cx + r * 0.45, cy + r * 0.2); ctx.lineTo(cx - r * 0.45, cy + r * 0.2); }
  else { const d = dir === 'left' ? -1 : 1; ctx.moveTo(cx + d * r * 0.42, cy); ctx.lineTo(cx - d * r * 0.25, cy - r * 0.4); ctx.lineTo(cx - d * r * 0.25, cy + r * 0.4); }
  ctx.closePath(); ctx.fill();
}
function drawControls() {
  if (!showTouch) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const s = dpr;
  const btns = [[ctl.L, touch.left, 'left'], [ctl.R, touch.right, 'right'], [ctl.J, touch.jump, 'up']];
  if (fireButtonOn()) btns.push([ctl.F, touch.fire, 'fire']);
  for (const [b, on, dir] of btns) {
    ctx.fillStyle = on ? 'rgba(255,255,255,0.38)' : (dir === 'fire' ? 'rgba(255,140,60,0.28)' : 'rgba(255,255,255,0.16)');
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2.5 * s;
    ctx.beginPath(); ctx.arc(b.x * s, b.y * s, b.r * s, 0, TAU); ctx.fill(); ctx.stroke();
    if (dir === 'fire') {
      const cx = b.x * s, cy = b.y * s, r = b.r * s;
      ctx.fillStyle = '#ff6a00'; ctx.beginPath(); ctx.arc(cx, cy, r * 0.34, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(cx + r * 0.06, cy - r * 0.05, r * 0.2, 0, TAU); ctx.fill();
      continue;
    }
    ctx.fillStyle = on ? '#ffffff' : 'rgba(255,255,255,0.85)';
    drawArrow(b.x * s, b.y * s, b.r * s, dir);
  }
}
function drawBanner() {
  const b = G.banner; if (!b) return;
  const a = clamp(Math.min(b.t / 0.25, (b.dur - b.t) / 0.4), 0, 1);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = a;
  const cy = canvas.height * 0.36, fs = clamp(cssH * 0.1, 22, 60) * dpr;
  if (b.lives) {
    const h = fs * 1.5, w = faces.hero ? h / faces.hero.aspect : h, total = w + fs * 2.3, x0 = canvas.width / 2 - total / 2;
    drawFaceIcon(faces.hero, x0, cy, h);
    outlined('× ' + G.lives, x0 + w + fs * 0.3, cy, 'left', fs);
  } else {
    ctx.fillStyle = 'rgba(20,8,40,0.45)'; ctx.fillRect(0, cy - fs * 1.05, canvas.width, fs * 2.3);
    outlined(b.title, canvas.width / 2, cy - fs * 0.2, 'center', fs);
    outlined(b.sub, canvas.width / 2, cy + fs * 0.72, 'center', Math.round(fs * 0.48), '#ffd1e0');
  }
  ctx.globalAlpha = 1;
}

function render() {
  if (!atlas) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#120b2a'; ctx.fillRect(0, 0, canvas.width, canvas.height); return; }
  drawBackground();
  if (G.tiles.length) drawWorld();
  if (G.state === 'play' || G.state === 'dying' || G.state === 'flag' || G.state === 'clear' || G.state === 'won') drawHUD();
  if (G.state === 'play' || G.state === 'dying' || G.state === 'flag') drawControls();
  drawBanner();
}

/* ============================================================================
   15) SCREENS (DOM overlays)
   ============================================================================ */
const screenEl = $('screen'), sTitle = $('s-title'), sSub = $('s-sub'), sFaces = $('s-faces'), sStats = $('s-stats'),
  btn1 = $('s-btn1'), btn2 = $('s-btn2'), sHint = $('s-hint'), btnPause = $('btnPause'), btnMute = $('btnMute');
let onBtn1 = null, onBtn2 = null, onTap = null;
function faceNode(key) {
  if (key === 'heart') { const s = document.createElement('div'); s.className = 'heartbeat'; s.textContent = '❤️'; return s; }
  const f = faces[key];
  if (f && f.url) { const im = document.createElement('img'); im.className = f.cutout ? 'face cut' : 'face'; im.alt = ''; im.src = f.url; return im; }
  const d = document.createElement('div'); d.className = 'face'; d.style.background = f ? f.color : '#ff5a7a';
  d.textContent = initials(f ? f.label : key); return d;
}
function showScreen(o) {
  sTitle.textContent = o.title || ''; sTitle.className = o.titleClass || '';
  sSub.textContent = o.sub || ''; sSub.hidden = !o.sub;
  sFaces.replaceChildren(...(o.faces || []).map(faceNode)); sFaces.hidden = !(o.faces && o.faces.length);
  sStats.textContent = o.stats || ''; sStats.hidden = !o.stats;
  btn1.textContent = o.btn1 || ''; btn1.hidden = !o.btn1; btn1.disabled = !!o.btn1Disabled; onBtn1 = o.onBtn1 || null;
  btn1.classList.toggle('pulse', !!o.pulse);
  btn2.textContent = o.btn2 || ''; btn2.hidden = !o.btn2; onBtn2 = o.onBtn2 || null;
  sHint.textContent = o.hint || ''; sHint.hidden = !o.hint;
  onTap = o.onTap || null;
  screenEl.classList.toggle('see-through', !!o.seeThrough);
  screenEl.classList.add('show');
  clearInput();
  syncTopButtons();
}
function hideScreen() { screenEl.classList.remove('show'); onTap = null; btn1.blur(); btn2.blur(); syncTopButtons(); }
btn1.addEventListener('click', (e) => { e.stopPropagation(); Sfx.init(); const f = onBtn1; if (f) f(); });
btn2.addEventListener('click', (e) => { e.stopPropagation(); Sfx.init(); const f = onBtn2; if (f) f(); });
screenEl.addEventListener('click', () => { if (onTap) { Sfx.init(); onTap(); } });

function controlsHint() {
  return showTouch
    ? 'Left thumb: ◀ ▶ run · Right thumb: tap to jump (hold = higher) · 🔥 button throws fire after pizza'
    : '← → / A D run · Space / ↑ jump (hold = higher) · F / X throw fire · P pause · M mute';
}
function showTitle() {
  G.state = 'title';
  loadLevel(0);
  G.camX = 0; G.panDir = 1;
  const u = progress.level;
  const stats = best ? 'Best score: ' + best : '';
  if (u > 0) {
    showScreen({ title: GAME_TITLE, faces: ['hero'], sub: GAME_TAGLINE, btn1: 'Continue · Level ' + (u + 1) + ' ▶', pulse: true,
      onBtn1: continueGame, onTap: continueGame, btn2: 'New Game', onBtn2: startGame, stats, hint: controlsHint() });
  } else {
    showScreen({ title: GAME_TITLE, faces: ['hero'], sub: GAME_TAGLINE, btn1: 'Tap to Start', pulse: true, onBtn1: startGame, onTap: startGame,
      stats, hint: controlsHint() });
  }
}
function showLevelClear() {
  const next = LEVELS[G.levelIndex + 1];
  showScreen({ title: LEVEL_CLEAR_MESSAGE, faces: ['hero', 'heart', 'me'], seeThrough: true,
    sub: 'Next up: Level ' + (G.levelIndex + 2) + ' · ' + next.name + (next.theme === 'night' ? ' 🌙' : ''),
    stats: 'Score ' + G.score + ' · Coins ' + G.coins + ' · Lives ' + G.lives + ' · ✓ Progress saved',
    btn1: 'Next Level ▶', onBtn1: () => startLevel(G.levelIndex + 1) });
}
function showWin() {
  showScreen({ title: WIN_MESSAGE, titleClass: 'win', faces: ['hero', 'heart', 'me'], sub: WIN_SUBTEXT, seeThrough: true,
    stats: 'Final score ' + G.score + (best ? ' · Best ' + best : ''), btn1: 'Play Again ↺', onBtn1: startGame });
}
function showGameOver() {
  const n = G.levelIndex + 1;
  showScreen({ title: 'Game Over', faces: ['hero'], sub: 'So close! Give it another go 💪', stats: 'Score ' + G.score,
    btn1: 'Start from Level ' + n, onBtn1: retryLevel, btn2: n > 1 ? 'Start from Level 1' : '', onBtn2: startGame });
}
function showPause() {
  showScreen({ title: 'Paused', sub: 'Level ' + (G.levelIndex + 1) + ' · ' + G.def.name, btn1: 'Resume ▶', onBtn1: resume,
    btn2: 'Restart Level', onBtn2: restartLevel, hint: controlsHint() });
}

function goFullscreen() {
  if (!showTouch) return;
  const el = document.documentElement;
  try {
    if (!document.fullscreenElement && el.requestFullscreen) {
      el.requestFullscreen({ navigationUI: 'hide' }).then(() => {
        if (screen.orientation && screen.orientation.lock) return screen.orientation.lock('landscape');
        return null;
      }).catch(() => {});
    }
  } catch (e) { /* not supported */ }
}
function startGame() {
  goFullscreen();
  G.score = 0; G.coins = 0; G.lives = START_LIVES; G.carryFire = false;
  saveProgress(0, 0);
  startLevel(0);
}
function continueGame() {
  goFullscreen();
  const i = progress.level;
  G.score = progress.score; G.coins = 0; G.lives = START_LIVES; G.carryFire = false;
  startLevel(i);
}
function startLevel(i) {
  loadLevel(i);
  G.scoreAtStart = G.score; G.coinsAtStart = G.coins;
  G.state = 'play'; G.paused = false;
  G.banner = { title: 'LEVEL ' + (i + 1), sub: LEVELS[i].name, t: 0, dur: 2.2 };
  hideScreen();
}
function retryLevel() { G.score = G.scoreAtStart; G.coins = G.coinsAtStart; G.lives = START_LIVES; G.carryFire = false; startLevel(G.levelIndex); }
function restartLevel() { G.score = G.scoreAtStart; G.coins = G.coinsAtStart; G.carryFire = false; startLevel(G.levelIndex); }
function canPause() { return G.state === 'play' || G.state === 'dying' || G.state === 'flag'; }
function pause() { if (!G.paused && canPause()) { G.paused = true; showPause(); } }
function resume() { G.paused = false; hideScreen(); last = performance.now(); }
function togglePause() { if (G.paused) resume(); else pause(); }
function toggleMute() { Sfx.init(); Sfx.setMuted(!Sfx.muted); syncTopButtons(); }
function syncTopButtons() {
  btnMute.classList.toggle('muted', Sfx.muted);
  btnMute.setAttribute('aria-label', Sfx.muted ? 'Unmute sound' : 'Mute sound');
  btnPause.hidden = !(canPause() && !G.paused);
}
btnMute.addEventListener('click', (e) => { e.stopPropagation(); toggleMute(); btnMute.blur(); });
btnPause.addEventListener('click', (e) => { e.stopPropagation(); pause(); btnPause.blur(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { clearInput(); pause(); } });

/* ============================================================================
   16) MAIN LOOP (+ automatic quality drop if a phone struggles)
   ============================================================================ */
let last = performance.now(), perfAcc = 0, perfN = 0, lastPortrait = false, lastPauseVisible = null;
function perfCheck(dt) {
  if (G.state !== 'play' || G.paused) { perfAcc = 0; perfN = 0; return; }
  perfAcc += dt; perfN++;
  if (perfN >= 150) {
    const avg = perfAcc / perfN; perfAcc = 0; perfN = 0;
    if (avg > 0.026 && dpr > 1.05) { quality = Math.max(0.4, quality * 0.8); needResize = true; }
  }
}
function frame(now) {
  requestAnimationFrame(frame);
  if (needResize) resize();
  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0)) dt = 0;
  if (dt > 0.1) dt = 0.1;
  const portrait = portraitMQ.matches;
  if (portrait && !lastPortrait) { clearInput(); }
  lastPortrait = portrait;
  if (!G.paused && !portrait && dt > 0) {
    perfCheck(dt);
    const n = Math.ceil(dt / MAX_STEP), h = dt / n;
    for (let i = 0; i < n; i++) update(h);
  }
  const pv = canPause() && !G.paused;
  if (pv !== lastPauseVisible) { lastPauseVisible = pv; syncTopButtons(); }
  render();
}

/* ============================================================================
   17) BOOT
   ============================================================================ */
document.title = GAME_TITLE;
resize();
syncTopButtons();
showScreen({ title: GAME_TITLE, sub: 'Loading…', btn1: 'Loading…', btn1Disabled: true });
requestAnimationFrame(frame);
loadAllFaces().catch(() => {}).then(() => {
  if (!faces.hero) faces.hero = buildFace(null, NAMES.hero, '#ff5a7a');
  if (!faces.me) faces.me = buildFace(null, NAMES.me, '#4a6cf7');
  if (!faces.enemies.length) faces.enemies.push(buildFace(null, 'Bo', ENEMY_COLORS[0]));
  showTitle();
  loadVoices();
});
async function loadVoices() {
  if (!/^https?:$/.test(location.protocol)) return;          // needs a web server (works on GitHub Pages / Netlify)
  for (const n of ['cry', 'laugh', 'giggle', 'atata', 'angry']) {
    for (const ext of ['mp3', 'm4a']) {
      try {
        const r = await fetch(SOUND_DIR + n + '.' + ext);
        if (!r.ok) continue;
        const b = await r.arrayBuffer();
        if (b.byteLength > 512) { Sfx.addVoice(n, b); break; }   // the offline cache answers missing clips with an empty file
      } catch (e) { /* offline and not cached */ }
    }
  }
}

// Small hook used by automated tests (harmless for players).
window.__loveRun = {
  G, bot, isSolid, isOneWay, LEVELS, progress, Sfx,
  get viewW() { return viewW; },
  startGame, startLevel, continueGame,
  eatCake: () => eatCake(G.player), eatPizza: () => eatPizza(G.player), eatBroccoli: () => eatBroccoli(G.player),
  hurtBoss: (n) => damageBoss(n || 1, true),
  simulate(seconds, botFn, until) {
    const steps = Math.round(seconds / MAX_STEP);
    const stop = until || ((g) => g.state !== 'play' && g.state !== 'flag');
    for (let i = 0; i < steps; i++) { if (botFn) botFn(this); update(MAX_STEP); if (stop(G)) break; }
    return G.state;
  },
};
})();
