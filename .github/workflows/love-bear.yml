# Builds the Love Bear desktop pet into a Windows installer and puts it on the repo's Releases page.
name: Love Bear (Windows app)

on:
  push:
    paths:
      - 'desktop-pet/**'
      - '.github/workflows/love-bear.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop-pet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Build the installer
        run: npx electron-builder --win nsis --publish never
      - name: Check that the app starts on Windows
        shell: pwsh
        run: |
          $env:LOVE_BEAR_SMOKE_FILE = "$env:RUNNER_TEMP\love-bear-smoke.json"
          $p = Start-Process -FilePath "dist\win-unpacked\Love Bear.exe" -ArgumentList "--smoke-test" -PassThru -Wait
          Write-Host "smoke test exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          if (-not (Test-Path $env:LOVE_BEAR_SMOKE_FILE)) { Write-Host "the bear never reported ready"; exit 1 }
          $r = Get-Content $env:LOVE_BEAR_SMOKE_FILE -Raw
          Write-Host "bear: $r"
          $j = $r | ConvertFrom-Json
          if (-not $j.ok -or -not $j.visible -or -not $j.tray) { exit 1 }
      - name: Check that installing over the old version closes and replaces it
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $prev = gh release list --limit 30 --json tagName | ConvertFrom-Json | ForEach-Object { $_.tagName } |
            Where-Object { $_ -like 'love-bear-v*' -and $_ -ne "love-bear-v$version" } | Select-Object -First 1
          if (-not $prev) { Write-Host "no older release to test against"; exit 0 }
          gh release download $prev --pattern "LoveBear-Setup-*.exe" --dir "$env:RUNNER_TEMP\old" --clobber
          $oldSetup = Get-ChildItem "$env:RUNNER_TEMP\old\LoveBear-Setup-*.exe" | Select-Object -First 1
          Start-Process $oldSetup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Love Bear.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Host "the old version did not install"; exit 1 }
          Write-Host "old version installed: $($exe.VersionInfo.ProductVersion) ($prev)"
          Get-Process -Name 'Love Bear' -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Process $exe.FullName
          Start-Sleep 6
          $before = @(Get-Process -Name 'Love Bear' -ErrorAction SilentlyContinue)
          Write-Host "old bear running: $($before.Count) processes"
          if ($before.Count -eq 0) { exit 1 }
          $newSetup = Get-ChildItem dist\LoveBear-Setup-*.exe | Select-Object -First 1
          $p = Start-Process $newSetup.FullName -ArgumentList '/S' -PassThru -Wait
          Write-Host "new installer exit code: $($p.ExitCode)"
          Start-Sleep 4
          $still = @($before | Where-Object { -not $_.HasExited })
          $exe2 = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Love Bear.exe' | Select-Object -First 1
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Love Bear.lnk'
          Write-Host "old processes still running: $($still.Count)"
          Write-Host "installed version now: $($exe2.VersionInfo.ProductVersion)"
          Write-Host "desktop shortcut: $(Test-Path $lnk)"
          Get-Process -Name 'Love Bear' -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($still.Count -gt 0 -or "$($exe2.VersionInfo.ProductVersion)" -notlike "$version*" -or -not (Test-Path $lnk)) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: LoveBear-Setup
          path: desktop-pet/dist/LoveBear-Setup-*.exe
      - name: Put the installer on the Releases page
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="love-bear-v$VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Love Bear $VERSION" \
              --notes "Download **LoveBear-Setup-$VERSION.exe** below and open it on the Windows laptop. If Windows says *Windows protected your PC*, click **More info** and then **Run anyway**."
          fi
          gh release upload "$TAG" dist/LoveBear-Setup-*.exe --clobber
